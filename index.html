<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA PIZZA - Sistema Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="productos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #0a0a0a; 
            color: #fafafa; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(217, 119, 6, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover { 
            background: rgba(25, 25, 25, 0.8);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .product-card {
            cursor: pointer;
        }
        .product-card:hover:not(.is-disabled) { 
            border-color: rgba(251, 146, 60, 0.3) !important;
            background: rgba(25, 25, 25, 0.9);
        }
        .product-card:active:not(.is-disabled) { 
            transform: scale(0.96);
        }
        .input-premium {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: #fafafa;
        }
        .input-premium::placeholder { color: rgba(255, 255, 255, 0.3); }
        .input-premium:focus { 
            border-color: #f97316;
            outline: none; 
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.2);
            background: rgba(20, 20, 20, 0.9);
        }
        .is-disabled { 
            opacity: 0.35; 
            filter: grayscale(1) brightness(0.8); 
            pointer-events: none;
            border-color: rgba(239, 68, 68, 0.15) !important;
        }
        .btn-premium {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }
        .btn-premium:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }
        .btn-premium:active:not(:disabled) {
            transform: scale(0.98);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover { 
            background: rgba(255, 255, 255, 0.25);
            background-clip: content-box;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-in {
            animation: slideUp 0.5s ease-out forwards;
        }
        .header-title {
            animation: fadeIn 0.8s ease-out;
        }
    </style>
</head>

<body x-data="carritoApp()" x-init="init()">

    <div class="max-w-md mx-auto p-5 pb-64">
        <header class="flex justify-between items-center py-10 px-2">
            <div class="header-title">
                <h1 class="text-5xl font-black tracking-tight bg-gradient-to-r from-orange-400 via-amber-400 to-yellow-600 bg-clip-text text-transparent italic">
                    LA PIZZA
                </h1>
                <p class="text-[9px] uppercase tracking-[0.35em] text-orange-500/60 font-black italic mt-1">Ticket Manager</p>
            </div>
            <button @click="limpiarPedido()" class="btn-premium p-3.5 rounded-xl bg-gradient-to-br from-red-600 to-red-700 text-white border border-red-500/20 shadow-xl hover:shadow-red-600/20 flex items-center gap-2 active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
                <span class="text-[9px] font-black uppercase tracking-widest hidden xs:inline">Vaciar</span>
            </button>
        </header>

        <div class="mb-10 relative mt-8">
            <label class="text-[9px] font-black text-orange-500/70 uppercase ml-2 mb-3 block tracking-widest text-center">🧑 Nombre del Cliente</label>
            <input type="text" x-model="cliente" placeholder="Tu nombre" class="input-premium w-full p-4 rounded-xl text-white font-bold text-base text-center shadow-xl placeholder:text-gray-600">
        </div>

        <div x-show="productos.length === 0" class="text-center py-20">
            <p class="text-amber-500 animate-pulse font-bold tracking-widest text-xs uppercase italic">Sincronizando menú...</p>
        </div>

        <template x-for="cat in ['Pizzas', 'Empanadas']">
            <div class="mb-12" x-show="productos.some(p => p.categoria === cat)">
                <div class="flex items-center gap-3 mb-6 px-1">
                    <h2 x-text="cat" class="text-sm font-black uppercase tracking-[0.2em] text-orange-400/80 text-shadow"></h2>
                    <div class="h-px flex-1 bg-gradient-to-r from-orange-500/40 via-transparent to-transparent"></div>
                </div>

                <div class="grid gap-3.5 px-1">
                    <template x-for="p in productos.filter(i => i.categoria === cat)">
                        <div class="glass-card product-card p-4 rounded-2xl flex justify-between items-center border relative overflow-hidden group"
                             :class="!p.activo ? 'is-disabled' : 'border-orange-500/20 hover:border-orange-500/40'">
                            
                            <div class="flex-1 mr-4">
                                <div class="flex flex-col gap-2">
                                    <template x-if="!p.activo">
                                        <span class="w-fit bg-gradient-to-r from-red-600 to-red-700 text-white text-[8px] px-2.5 py-1 rounded-lg font-black uppercase mb-1 shadow-lg shadow-red-600/30 tracking-wider">
                                            ⚠ AGOTADO
                                        </span>
                                    </template>
                                    <h3 class="font-bold text-gray-50 text-base leading-tight group-hover:text-orange-300 transition-colors" x-text="p.nombre"></h3>
                                    
                                    <template x-if="p.descripcion">
                                        <p class="text-[10px] text-gray-400 font-medium italic leading-snug" x-text="p.descripcion"></p>
                                    </template>

                                    <span class="text-orange-400 font-black text-base">$<span x-text="p.precio.toLocaleString()"></span></span>
                                </div>
                            </div>
                            
                            <div class="flex items-center bg-black/60 rounded-xl p-1 border border-orange-500/20" x-show="p.activo">
                                <button @click="restar(p.id)" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-white/10 transition text-xl text-white font-black">−</button>
                                <span class="w-8 text-center font-black text-orange-400 text-base" x-text="cantidades[p.id] || 0"></span>
                                <button @click="sumar(p.id)" class="w-9 h-9 flex items-center justify-center rounded-lg bg-gradient-to-br from-orange-500 to-orange-600 text-white font-black shadow-lg text-base transition hover:from-orange-400 hover:to-orange-500">+</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <div class="fixed bottom-0 left-0 right-0 z-50 p-4 backdrop-blur-xl bg-black/30">
        <div class="max-w-md mx-auto glass-card rounded-3xl p-6 shadow-2xl border-t border-orange-500/20 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-orange-500/5 to-transparent pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-6 relative z-10">
                <div class="flex-1">
                    <p class="text-[9px] font-black text-gray-500 uppercase tracking-[0.15em]">💰 Total Pedido</p>
                    <div class="flex flex-col gap-1 mt-2">
                        <span class="text-4xl font-black text-transparent bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text">$<span x-text="total().toLocaleString()"></span></span>
                        <span class="text-[8px] text-blue-400 font-bold tracking-wider uppercase">Transferencia (+10%): $<span x-text="totalTransfe().toLocaleString()"></span></span>
                    </div>
                </div>
                <div @click="toggleCart()" class="relative cursor-pointer group">
                    <div class="btn-premium bg-gradient-to-br from-orange-500 to-orange-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center shadow-xl group-hover:shadow-orange-600/30 border border-orange-400/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <span class="absolute -top-2 -right-2 bg-gradient-to-br from-red-500 to-red-600 text-white text-[9px] font-black w-7 h-7 rounded-full flex items-center justify-center border-2 border-black shadow-lg" x-text="itemsCount()"></span>
                </div>
            </div>

            <div class="w-full relative z-10 px-1">
                <button @click="generarTicket()" class="btn-premium w-full bg-gradient-to-r from-white to-gray-100 text-black py-4 rounded-xl font-black uppercase text-[10px] tracking-widest flex items-center justify-center gap-2 shadow-xl hover:shadow-white/20">
                    <span>📱 Generar Ticket</span>
                </button>
            </div>
        </div>
    </div>

    <div x-cloak x-show="showCart" x-transition.opacity class="fixed inset-0 bg-black/80 backdrop-blur-lg z-[60] p-6 flex items-center justify-center">
        <div class="glass-card w-full max-w-sm rounded-3xl border border-orange-500/30 flex flex-col max-h-[80vh] overflow-hidden">
            <div class="p-8 border-b border-orange-500/20 flex justify-between items-center">
                <h3 class="font-black uppercase text-[9px] tracking-[0.3em] text-orange-400">📦 Resumen del Pedido</h3>
                <button @click="showCart = false" class="btn-premium bg-white/10 hover:bg-white/20 p-2 rounded-lg text-gray-300 font-black text-lg transition">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto p-8 space-y-5">
                <template x-for="item in detalleCarrito()">
                    <div class="flex justify-between items-start border-b border-gray-800 pb-5">
                        <div class="text-left flex-1">
                            <p class="font-bold text-gray-50 text-sm leading-tight" x-text="item.nombre"></p>
                            <p class="text-[9px] text-gray-500 font-black uppercase tracking-widest mt-1.5" x-text="item.cant + ' Unidad' + (item.cant > 1 ? 'es' : '')"></p>
                        </div>
                        <p class="font-mono text-orange-400 font-black text-sm">$<span x-text="(item.cant * item.precio).toLocaleString()"></span></p>
                    </div>
                </template>
            </div>
            <div class="p-6 border-t border-orange-500/20 bg-gradient-to-r from-black/30 to-black/20">
                <div class="flex justify-between items-center">
                    <span class="font-black text-gray-300 text-sm">TOTAL:</span>
                    <span class="text-2xl font-black text-orange-400">$<span x-text="total().toLocaleString()"></span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function carritoApp() {
            return {
                productos: [],
                showCart: false,
                cantidades: {},
                cliente: '',
                async init() {
                    const apiUrl = 'https://a365.com.ar/api/pizzas/get?_=' + Date.now();
                    try {
                        const res = await fetch(apiUrl);
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        this.productos = (Array.isArray(data) ? data : []).map(r => ({
                            id: Number(r.id) || 0,
                            nombre: String(r.nombre || '').trim(),
                            descripcion: (r.descripcion === null || r.descripcion === undefined) ? '' : String(r.descripcion).trim(),
                            precio: Number(r.precio) || 0,
                            categoria: String(r.categoria || 'General').trim(),
                            activo: !!r.activo
                        })).filter(p => p.nombre);
                        console.log('Productos cargados desde API:', this.productos);
                    } catch (e) {
                        console.error('API fetch error:', e);
                        if (window.PRODUCTOS && Array.isArray(PRODUCTOS) && PRODUCTOS.length) {
                            console.warn('Usando PRODUCTOS local como fallback');
                            this.productos = PRODUCTOS.map(p => ({
                                id: Number(p.id) || 0,
                                nombre: String(p.nombre || '').trim(),
                                descripcion: p.descripcion || '',
                                precio: Number(p.precio) || 0,
                                categoria: p.categoria || 'General',
                                activo: !!p.activo
                            }));
                        } else {
                            alert('Error cargando productos. Intente más tarde.');
                        }
                    }
                },
                sumar(id) { 
                    this.cantidades[id] = (this.cantidades[id] || 0) + 1;
                    if (navigator.vibrate) navigator.vibrate(15);
                },
                restar(id) { 
                    if (this.cantidades[id] > 0) {
                        this.cantidades[id]--;
                        if (navigator.vibrate) navigator.vibrate(15);
                    }
                },
                total() {
                    return Object.keys(this.cantidades).reduce((acc, id) => {
                        const p = this.productos.find(i => i.id == id);
                        return acc + (p ? p.precio * this.cantidades[id] : 0);
                    }, 0);
                },
                totalTransfe() { return Math.round(this.total() * 1.10) },
                itemsCount() { return Object.values(this.cantidades).reduce((s, n) => s + (n || 0), 0) },
                toggleCart() { if(this.itemsCount() > 0) this.showCart = !this.showCart },
                detalleCarrito() {
                    return Object.keys(this.cantidades).filter(id => this.cantidades[id] > 0).map(id => {
                        const p = this.productos.find(i => i.id == id);
                        return { nombre: p.nombre, descripcion: p.descripcion || '', cant: this.cantidades[id], precio: p.precio };
                    });
                },
                limpiarPedido() {
                    if(confirm('¿Vaciamos el ticket actual?')) { this.cantidades = {}; this.cliente = ''; this.showCart = false; }
                },
                enviarWhatsApp() {
                    if (this.total() === 0) return alert("¡Ticket vacío!");
                    let msj = `🍕 *LA PIZZA - NUEVO PEDIDO*%0A*Cliente:* ${this.cliente || 'Mostrador'}%0A%0A`;
                    this.detalleCarrito().forEach(i => msj += `• ${i.cant}x ${i.nombre}%0A`);
                    msj += `%0A💵 *Total Efectivo: $${this.total().toLocaleString()}*%0A💳 *Total Transferencia: $${this.totalTransfe().toLocaleString()}*`;
                    window.open(`https://wa.me/1161060970?text=${msj}`, '_blank');
                },
                generarTicket() {
                    if (this.total() === 0) return alert('¡Ticket vacío!');
                    
                    const ticketTexto = `LA PIZZA - COMPROBANTE DE VENTA

Fecha: ${new Date().toLocaleString()}
Cliente: ${this.cliente || 'Venta Mostrador'}

${this.detalleCarrito().map(i => `${i.cant}x ${i.nombre}${i.descripcion ? ' - ' + i.descripcion : ''}  $${(i.cant * i.precio).toLocaleString()}`).join('\n')}

─────────────────────────────
TOTAL EFECTIVO: $${this.total().toLocaleString()}
TOTAL TRANSFERENCIA: $${this.totalTransfe().toLocaleString()}
─────────────────────────────

¡Gracias por tu compra!`;

                    // Opciones de compartir
                    const opciones = [
                        '📱 WhatsApp',
                        '🔗 Compartir',
                        '📋 Copiar'
                    ];
                    
                    let mensaje = '¿Cómo deseas compartir el ticket?\n\n';
                    opciones.forEach((opt, idx) => mensaje += `${idx + 1}. ${opt}\n`);
                    
                    const respuesta = prompt(mensaje, '1');
                    
                    if (respuesta === '1') {
                        // Enviar por WhatsApp
                        let msj = encodeURIComponent(ticketTexto);
                        window.open(`https://wa.me/1161060970?text=${msj}`, '_blank');
                    } else if (respuesta === '2') {
                        // Usar Web Share API
                        if (navigator.share) {
                            navigator.share({
                                title: 'LA PIZZA - Ticket',
                                text: ticketTexto
                            }).catch(err => console.log('Share cancelado:', err));
                        } else {
                            navigator.clipboard.writeText(ticketTexto).then(() => {
                                alert('Ticket copiado al portapapeles.');
                            }).catch(err => alert('Ticket:\n\n' + ticketTexto));
                        }
                    } else if (respuesta === '3') {
                        // Copiar al portapapeles
                        navigator.clipboard.writeText(ticketTexto).then(() => {
                            alert('Ticket copiado al portapapeles. Puedes pegarlo en WhatsApp, email, etc.');
                        }).catch(err => alert('Ticket:\n\n' + ticketTexto));
                    }
                }
            }
        }
    </script>
</body>
</html>
